<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音乐播放器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 头部区域 -->
        <header class="header">
            <h1 class="title">音乐播放器</h1>
            <div class="header-buttons">
                <button class="mode-toggle" id="modeToggle" aria-label="切换播放模式">外链模式</button>
                <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
                <svg class="theme-icon sun-icon" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512">
                    <path d="M256 118a22 22 0 0 1-22-22V48a22 22 0 0 1 44 0v48a22 22 0 0 1-22 22z" fill="currentColor"></path>
                    <path d="M256 486a22 22 0 0 1-22-22v-48a22 22 0 0 1 44 0v48a22 22 0 0 1-22 22z" fill="currentColor"></path>
                    <path d="M369.14 164.86a22 22 0 0 1-15.56-37.55l33.94-33.94a22 22 0 0 1 31.11 31.11l-33.94 33.94a21.93 21.93 0 0 1-15.55 6.44z" fill="currentColor"></path>
                    <path d="M108.92 425.08a22 22 0 0 1-15.55-37.56l33.94-33.94a22 22 0 1 1 31.11 31.11l-33.94 33.94a21.94 21.94 0 0 1-15.56 6.45z" fill="currentColor"></path>
                    <path d="M464 278h-48a22 22 0 0 1 0-44h48a22 22 0 0 1 0 44z" fill="currentColor"></path>
                    <path d="M96 278H48a22 22 0 0 1 0-44h48a22 22 0 0 1 0 44z" fill="currentColor"></path>
                    <path d="M403.08 425.08a21.94 21.94 0 0 1-15.56-6.45l-33.94-33.94a22 22 0 0 1 31.11-31.11l33.94 33.94a22 22 0 0 1-15.55 37.56z" fill="currentColor"></path>
                    <path d="M142.86 164.86a21.89 21.89 0 0 1-15.55-6.44l-33.94-33.94a22 22 0 0 1 31.11-31.11l33.94 33.94a22 22 0 0 1-15.56 37.55z" fill="currentColor"></path>
                    <path d="M256 358a102 102 0 1 1 102-102a102.12 102.12 0 0 1-102 102z" fill="currentColor"></path>
                </svg>
                <svg class="theme-icon moon-icon" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px" viewBox="0 0 512 512" enable-background="new 0 0 512 512" xml:space="preserve">
                    <path d="M195,125c0-26.3,5.3-51.3,14.9-74.1C118.7,73,51,155.1,51,253c0,114.8,93.2,208,208,208c97.9,0,180-67.7,202.1-158.9c-22.8,9.6-47.9,14.9-74.1,14.9C281,317,195,231,195,125z"></path>
                </svg>
                </button>
            </div>
        </header>

        <!-- 音乐播放区域 -->
        <main class="player-section">
            <div class="player-container">
                <div class="song-info">
                    <h2 class="song-title" id="songTitle">正在播放</h2>
                    <p class="song-artist" id="songArtist">请选择歌单开始播放</p>
                </div>
                <div class="music-player">
                    <iframe 
                        id="iframePlayer"
                        frameborder="no" 
                        border="0" 
                        marginwidth="0" 
                        marginheight="0" 
                        width="330" 
                        height="86" 
                        src="https://music.163.com/outchain/player?type=2&id=2154219378&auto=1&height=66"
                        allow="autoplay">
                    </iframe>
                    <audio id="audioPlayer" controls class="hidden">
                </div>
                <div class="player-controls">
                    <button class="control-btn" id="prevBtn" aria-label="上一首">⏮</button>
                    <button class="control-btn hidden" id="playPauseBtn" aria-label="播放">▶</button>
                    <button class="control-btn" id="nextBtn" aria-label="下一首">⏭</button>
                </div>
            </div>
        </main>

        <!-- 歌单选择区域 -->
        <section class="playlist-section collapsed" id="playlistSection">
            <div class="playlist-header">
                <h3 class="playlist-title">我的歌单</h3>
                <button class="playlist-toggle" id="playlistToggle" aria-label="展开/收起歌单">
                    <span class="toggle-arrow">▲</span>
                </button>
            </div>
            <div class="playlist-container" id="playlistContainer">
                <!-- 歌单列表由 JavaScript 从 songs.json 动态加载 -->
            </div>
        </section>

        <!-- 加载状态提示 -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-spinner"></div>
            <p class="loading-text">正在加载音乐...</p>
        </div>

        <!-- 错误提示 -->
        <div class="error-message" id="errorMessage">
            <span class="error-icon">⚠️</span>
            <p class="error-text">加载失败，请重试</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
